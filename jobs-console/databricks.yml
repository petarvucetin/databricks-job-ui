bundle:
  name: jobs-console

resources:
  apps:
    app:
      name: "jobs-console"
      description: "Jobs and pipelines console: attention list, run timeline, run details"
      # Prebuilt by `npm run package` and committed: bundled server + built client + app.yaml, no package.json,
      # so the platform runs no `npm install` (GovCloud apps can't reach the npm registry).
      source_code_path: ./deploy

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # No user_api_scopes: Apps user authorization has no jobs or pipelines scope (the API rejects `jobs` with
      # 400 INVALID_PARAMETER_VALUE; supported list: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-apps/auth#supported-scopes).
      # The app reads Jobs and Pipelines as its service principal (JOBS_CONSOLE_AUTH=app in app.yaml), which needs
      # CAN_VIEW on the jobs and pipelines it should show. The viewer's x-forwarded-email still decides "Mine".

      # Optional: run history from system tables. To enable, uncomment this block with a real warehouse id, and
      # uncomment the DATABRICKS_WAREHOUSE_ID env entry in app.yaml (it needs this resource). Then `npm run package`
      # and deploy. The app's service principal gets CAN_USE; see README "Run history from system tables".
      # This is for the default target only: dev / stg / prod take `deploy.ps1 -Warehouse <id>` (see app_resources).
      # resources:
      #   - name: sql-warehouse
      #     sql_warehouse:
      #       id: "<warehouse id>"
      #       permission: CAN_USE

variables:
  # The dev / stg / prod app config: command + env, with JOBS_CONSOLE_ENV as the label. Each target sets its own
  # value below. It spells out the full config, so it doesn't matter whether `config` replaces or merges app.yaml.
  app_config:
    type: complex
    description: "App config (command + env) of the dev / stg / prod targets"
    default: {}
  # The dev / stg / prod app resources: none by default (history from the API).
  # `deploy.ps1 -Warehouse <id>` turns on system-tables history for one deploy: it writes both variables to the
  # gitignored .databricks/bundle/<target>/variable-overrides.json, adding the sql-warehouse resource and the
  # DATABRICKS_WAREHOUSE_ID entry (value_from: sql-warehouse) together. No warehouse id is committed.
  app_resources:
    type: complex
    description: "App resources of the dev / stg / prod targets"
    default: []

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405612029409959.19.azuredatabricks.net

  # AWS GovCloud (us-gov-west-1), one workspace per env. Same app, same prebuilt deploy/ folder, labeled by
  # JOBS_CONSOLE_ENV. Deploy with .\deploy.ps1 -Env <dev|stg|prod>, which uses the profile of the same name.
  # No host here: the CLI does not interpolate variables in workspace.host (it parses "${var.x}" literally;
  # https://github.com/databricks/cli/issues/1786), so each takes its host from the profile:
  # databricks auth login --host <url> --profile prod.
  dev:
    variables:
      app_config:
        default:
          command: ['node', 'server.mjs']
          env:
            - { name: NODE_ENV, value: production }
            - { name: JOBS_CONSOLE_DATA, value: live }
            - { name: JOBS_CONSOLE_AUTH, value: app }
            - { name: JOBS_CONSOLE_ENV, value: dev }
    resources:
      apps:
        app:
          config: ${var.app_config}
          resources: ${var.app_resources}

  stg:
    variables:
      app_config:
        default:
          command: ['node', 'server.mjs']
          env:
            - { name: NODE_ENV, value: production }
            - { name: JOBS_CONSOLE_DATA, value: live }
            - { name: JOBS_CONSOLE_AUTH, value: app }
            - { name: JOBS_CONSOLE_ENV, value: stg }
    resources:
      apps:
        app:
          config: ${var.app_config}
          resources: ${var.app_resources}

  prod:
    variables:
      app_config:
        default:
          command: ['node', 'server.mjs']
          env:
            - { name: NODE_ENV, value: production }
            - { name: JOBS_CONSOLE_DATA, value: live }
            - { name: JOBS_CONSOLE_AUTH, value: app }
            - { name: JOBS_CONSOLE_ENV, value: prod }
    resources:
      apps:
        app:
          config: ${var.app_config}
          resources: ${var.app_resources}
