bundle:
  name: jobs-console

resources:
  apps:
    app:
      name: "jobs-console"
      description: "Jobs and pipelines console: attention list, run timeline, run details"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Live mode (JOBS_CONSOLE_DATA=live) calls the Jobs and Pipelines APIs as the signed-in user.
      # Scope names: https://docs.databricks.com/api/workspace/api/scopes (jobs, pipelines); Apps user authorization:
      # https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-apps/auth
      user_api_scopes:
        - jobs
        - pipelines

variables:
  # Accepted for the documented deploy command, but informational only: the CLI does not interpolate variables in
  # workspace.host (it parses "${var.gov_host}" literally; https://github.com/databricks/cli/issues/1786), so the
  # gov target takes its host from the profile: databricks auth login --host <url> --profile gov.
  gov_host:
    description: "Workspace URL of the gov target, e.g. https://dbc-1234abcd-5678.cloud.databricks.us"
    default: ""

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405612029409959.19.azuredatabricks.net

  # AWS GovCloud (us-gov-west-1). Same app, same user_api_scopes (they sit on the app resource, so every target gets
  # them). No host here: it comes from --profile gov (see the gov_host note above).
  gov: {}
