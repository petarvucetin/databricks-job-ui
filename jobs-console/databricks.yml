bundle:
  name: jobs-console

resources:
  apps:
    app:
      name: "jobs-console"
      description: "Jobs and pipelines console: attention list, run timeline, run details"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Live mode (JOBS_CONSOLE_DATA=live) calls the Jobs and Pipelines APIs as the signed-in user.
      # Scope names: https://docs.databricks.com/api/workspace/api/scopes (jobs, pipelines); Apps user authorization:
      # https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-apps/auth
      user_api_scopes:
        - jobs
        - pipelines

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405612029409959.19.azuredatabricks.net
