# Generated by `npm run package` from ../app.yaml. Edit that file and re-run, or edit here on a machine without Node.
command: ['node', 'server.mjs']
env:
  - name: NODE_ENV
    value: production
  - name: JOBS_CONSOLE_DATA
    value: live
  # Read as the app's service principal: Apps user authorization has no jobs/pipelines scope.
  # `user` (per-user token) stays in the code for when Databricks adds those scopes.
  - name: JOBS_CONSOLE_AUTH
    value: app
