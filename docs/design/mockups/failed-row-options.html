<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Failed row: where do cause (4) and failing task (5) go?</title>
<!-- Real app styles, so the rows match the app pixel for pixel. Serve the repo root. -->
<link rel="stylesheet" href="/jobs-console/client/src/styles/tokens.css">
<link rel="stylesheet" href="/jobs-console/client/src/components/runrow.css">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("/jobs-console/client/public/fonts/IBMPlexSans-400.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("/jobs-console/client/public/fonts/IBMPlexSans-500.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("/jobs-console/client/public/fonts/IBMPlexSans-600.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("/jobs-console/client/public/fonts/IBMPlexMono-400.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("/jobs-console/client/public/fonts/IBMPlexMono-500.woff2") format("woff2"); }
  body { background: var(--paper); padding: 18px 28px 40px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--ink-2); margin: 0 0 18px; }
  .opt { margin-bottom: 26px; }
  .opt h2 { display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .opt h2 b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--label); color: #fff; font-size: 12px; }
  .opt h2 span { font-weight: 400; color: var(--ink-2); font-size: 13px; }

  /* A: cause line under the name */
  .ca { display: flex; align-items: baseline; gap: 8px; margin-top: 5px; font-size: 12.5px; }
  .ca .c { color: var(--red); font-weight: 500; }
  .ca .t { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .ca .t em { font-style: normal; color: var(--ink-3); font-family: var(--sans); }

  /* B: failed pill on the top line, same shape as the waiting pill */
  .rr-st.fail { background: var(--wash-red); border-color: #efb9ab; }
  .rr-st.fail span { color: var(--red); }
  .rr-st.fail b { color: var(--ink); }
  .rr-st.fail code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

  /* C: note next to the failed run box it explains */
  .cn { display: inline-flex; align-items: baseline; gap: 6px; margin-left: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .cn::before { content: ""; width: 14px; height: 1px; background: var(--red); align-self: center; }
  .cn .c { color: var(--red); font-weight: 500; }
  .cn code { font-family: var(--mono); font-size: 11.5px; }
</style>
</head>
<body>
<h1>Failed rows: where do the cause (4) and failing task (5) go?</h1>
<p class="sub">Each option shows the same three failed rows: a job with one failed task, a pipeline with one failed flow, and a job with two failed tasks. The full error text stays in the run pane.</p>

<div id="opts"></div>

<script>
const rows = [
  { type: 'job', ra: 'sp-analytics', prefix: '[prod] ', name: 'finance_gl_co_core_tables_ca0', avg: '17m 58s', cause: 'Cluster error', task: 'publish', more: 0,
    hist: [['succeeded', '18m', '21/22:10'], ['succeeded', '17m', '22/00:40'], ['cancelled', '19m', '22/06:40'], ['failed', '19m', '22/07:10']] },
  { type: 'pipeline', ra: 'sp-finance', prefix: '[prod] ', name: 'raw_bronze_sap_sap_erp1_edw_core_tables_fin0_dev', avg: '41m 12s', cause: 'Permission denied', task: 'gold_vendors', more: 0,
    hist: [['succeeded', '39m', '21/23:00'], ['succeeded', '44m', '22/03:00'], ['failed', '12m', '22/07:00']] },
  { type: 'job', ra: 'sp-ingest', prefix: '[prod] ', name: 'aiges_ingest_sap_backfill_sys_bic_ngc_dwh_project_databricks_md_gl_balances_v3', avg: '1h 04m', cause: 'Table not found', task: 'load_gl', more: 1,
    hist: [['succeeded', '1h02', '21/20:00'], ['partial', '58m', '22/02:00'], ['failed', '31m', '22/06:30']] },
];
const wrapName = (s) => s.split('_').join('_<wbr>');
const taskLabel = (r) => r.more ? `${r.task} +${r.more}` : r.task;
const box = ([res, t, w]) => `<span class="rh-wrap"><button type="button" class="rh ${res}"><span class="rh-t">${t}</span><span class="rh-w">${w}</span></button></span>`;
const unit = (r) => r.type === 'pipeline' ? 'flow' : 'task';

function row(r, v) {
  const top = `<span class="rr-tag ${r.type}">${r.type === 'pipeline' ? 'Pipeline' : 'Job'}</span><span class="rr-ra">run as <b>${r.ra}</b></span>`
    + (v === 'B' ? `<span class="rr-st fail"><span>failed</span><b>${r.cause}</b><code>${taskLabel(r)}</code></span>` : '');
  const causeLine = v === 'A'
    ? `<div class="ca"><span class="c">${r.cause}</span><span class="t"><em>in ${unit(r)}${r.more ? 's' : ''}</em> ${r.more ? `${r.task}, +${r.more} more` : r.task}</span></div>` : '';
  const note = v === 'C' ? `<span class="cn"><span class="c">${r.cause}</span> in <code>${taskLabel(r)}</code></span>` : '';
  return `<div class="rr"><div class="rr-main"><div class="rr-l1">${top}</div>
      <span class="rr-name"><i>${r.prefix}</i>${wrapName(r.name)}</span>${causeLine}</div>
    <div class="rr-hist"><div class="rr-hist-t"><span>Run history</span><span class="rr-avg-t">average <em>${r.avg}</em></span></div>
      <div class="rr-hist-boxes">${r.hist.map(box).join('')}${note}</div></div></div>`;
}

const opts = [
  ['A', 'Cause line under the name', 'red cause, then the task or flow at fault; one extra line in the name column'],
  ['B', 'Failed pill on the top line', 'same shape and place as the waiting pill on queued rows; row height unchanged'],
  ['C', 'Note beside the failed run box', 'the cause is attached to the run it explains; the name column is untouched'],
];
document.getElementById('opts').innerHTML = opts.map(([k, t, d]) =>
  `<section class="opt"><h2><b>${k}</b>${t}<span>${d}</span></h2>${rows.map((r) => row(r, k)).join('')}</section>`).join('');
</script>
</body>
</html>
