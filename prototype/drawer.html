<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs · attention</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("/files/IBMPlexSans-400.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-style: normal; font-display: swap; src: url("/files/IBMPlexSans-500.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-style: normal; font-display: swap; src: url("/files/IBMPlexSans-600.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("/files/IBMPlexMono-400.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url("/files/IBMPlexMono-500.woff2") format("woff2"); }
  :root {
    --paper: #f6f0e7; --sheet: #fffdf9; --ink: #27211c; --ink-2: #5b524a; --ink-3: #948a80; --rule: #e6ddd2;
    --red: #d6452f; --amber: #d98a12; --green: #2c8c6a; --blue: #2f6fb3;
    --wash-red: #fbe7e1; --wash-amber: #fdf0d8; --wash-green: #e3f2ea; --wash-sand: #f4ece1;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--sheet); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.45; overflow: hidden; }
  button { font: inherit; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--wash-sand); border: 1px solid #eadfcf; color: var(--ink-2); font-size: 12px; line-height: 1.4; white-space: nowrap; }
  .pill.red { background: var(--wash-red); border-color: #f1c4b8; color: var(--red); }
  .pill.amber { background: var(--wash-amber); border-color: #f0d9a6; color: #9a5f05; }
  .pill.green { background: var(--wash-green); border-color: #bfe0cf; color: var(--green); }

  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--sheet); }
  .seg span { padding: 5px 12px; cursor: pointer; color: var(--ink-2); }
  .seg span + span { border-left: 1px solid var(--rule); }
  .seg span.on { background: var(--wash-amber); color: var(--ink); font-weight: 500; }
  .fc { position: relative; }
  .fc > .btn { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap; font: inherit; }
  .fc > .btn.on { border-color: #e8c98a; background: var(--wash-amber); color: var(--ink); }
  .fc > .btn .chev { color: var(--ink-3); font-size: 10px; }
  .fc > .btn .x { color: var(--ink-3); margin-left: 2px; }
  .fc > .btn .x:hover { color: var(--ink); }
  .fc .menu { position: absolute; top: 34px; left: 0; z-index: 6; min-width: 200px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 28px rgba(60,40,20,.14); padding: 6px 0; display: none; }
  .fc.open .menu { display: block; }
  .fc .menu label { display: flex; align-items: center; gap: 10px; padding: 6px 14px; cursor: pointer; color: var(--ink); font-size: 13px; }
  .fc .menu label:hover { background: #faf5ec; }
  .fc .menu label .n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .fc .menu input { accent-color: var(--amber); }
  .tgl { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap; font: inherit; }
  .tgl i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  .tgl em { font-style: normal; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tgl.on { border-color: #b9cfea; background: #e3ecf7; color: var(--ink); }
  .tgl.on i { animation: blink 1.2s ease-in-out infinite; }
  .tgl.on em { color: var(--blue); }
  @keyframes blink { 50% { opacity: .25; } }
  .range { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); color: var(--ink-2); white-space: nowrap; }
  .range b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .range .x { color: var(--ink-3); cursor: pointer; }
  .search { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); }
  .search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; color: var(--ink); width: 110px; }
  .search input::placeholder { color: var(--ink-3); }
  .search.name input { width: 330px; }

  .wrap { position: absolute; top: 0; bottom: 0; left: 0; right: 0; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; background: var(--sheet); text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 6px 12px; border-bottom: 1px solid var(--rule); z-index: 1; }
  thead th:first-child { padding-left: 24px; }
  tbody td { padding: 6px 12px; border-bottom: 1px solid #f1eadf; white-space: nowrap; vertical-align: middle; }
  tbody td:first-child { padding-left: 21px; border-left: 3px solid transparent; }
  tbody tr.item { cursor: pointer; }
  tbody tr.item:hover td { background: #faf5ec; }
  tbody tr.item.on td { background: var(--wash-amber); }
  tbody tr.item.on td:first-child { border-left-color: var(--amber); }
  tbody tr.grp td { padding: 14px 12px 6px 24px; border-bottom: 1px solid var(--rule); font-weight: 500; cursor: pointer; background: var(--sheet); }
  tbody tr.grp td .cnt { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; font-weight: 500; font-size: 12px; background: var(--wash-sand); color: var(--ink-2); }
  tbody tr.grp td .cnt.red { background: var(--wash-red); color: var(--red); }
  tbody tr.grp td .cnt.amber { background: var(--wash-amber); color: #9a5f05; }
  tbody tr.grp td .n { color: var(--ink-3); font-weight: 400; margin-left: 8px; }
  tbody tr.grp td .chev { color: var(--ink-3); font-size: 11px; margin-right: 8px; display: inline-block; width: 10px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c9bfb2; margin-right: 10px; vertical-align: 0; }
  .dot.red { background: var(--red); } .dot.amber { background: var(--amber); }
  td.name { font-family: var(--mono); font-size: 12.5px; max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
  td.name i { font-style: normal; color: var(--ink-3); }
  td.dim { color: var(--ink-2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  td.mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }

  .scp { margin: 12px 24px 8px 24px; padding: 9px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .scp .vr { width: 1px; height: 20px; background: var(--rule); margin: 0 6px; }
  .scp .clear { margin-left: auto; color: var(--ink-3); cursor: pointer; font-size: 13px; }
  .scp .clear:hover { color: var(--ink); }
  .scp .meta { color: var(--ink-3); font-size: 12.5px; padding-left: 12px; border-left: 1px solid var(--rule); }
  .scp .t { font-size: 12.5px; font-weight: 500; color: var(--ink); margin-right: 4px; }
  .scp .seg span i { font-style: normal; color: var(--ink-3); margin-left: 8px; font-variant-numeric: tabular-nums; }
  .scp .seg span.on i { color: #9a5f05; }
  /* temporary component labels */
  .refblk [data-c]::before, .lgd b { content: attr(data-c); display: inline-block; flex: none; vertical-align: 1px; margin-right: 5px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: #6b3fd6; color: #fff; font: 600 10px/16px var(--sans); font-style: normal; text-align: center; text-indent: 0; letter-spacing: 0; text-transform: none; }
  .refblk .st[data-c] { position: relative; }
  .refblk .st[data-c]::before { position: absolute; left: -24px; top: 4px; margin: 0; }
  .refblk .st .now b[data-c]::before { vertical-align: 6px; }
  .refblk { display: none; margin: 10px 24px 0 24px; padding: 10px 12px 2px 12px; border: 1px dashed #b9a6ea; border-radius: 10px; }
  body.lbl .refblk { display: block; }
  .refblk .rt { font-size: 12px; font-weight: 500; color: #6b3fd6; margin: 0 0 8px 2px; }
  .refblk .card { cursor: default; }
  .lgd { margin: 4px 0 10px 0; padding: 4px 4px; font-size: 12.5px; color: var(--ink-2); display: grid; grid-template-columns: 1fr 1fr; gap: 7px 36px; }
  .lgd div { display: grid; grid-template-columns: 22px 150px 1fr; align-items: baseline; }
  .lgd div > span:first-of-type { color: var(--ink); font-weight: 500; }
  .lgd .k { grid-column: 1 / -1; color: var(--ink-3); font-size: 11px; text-align: right; }
  /* day × time matrix */
  .mx { margin: 10px 24px 6px 24px; padding: 10px 14px 14px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
  .mxhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .mxhead .t { font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .mxhead .sp { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .mxsc span { padding: 2px 10px; font-size: 12px; }
  .mxd .cubes .cube { max-width: 80px; margin: 0 auto; }
  .mxdays { display: flex; gap: 6px; padding: 0; margin-left: auto; }
  .mxdays span { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: pointer; }
  .mxdays span.on { background: var(--wash-amber); border-color: #e8c98a; color: var(--ink); }
  .mxgrid { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; align-items: start; position: relative; isolation: isolate; margin-top: 20px; }
  .mxwin-n { position: absolute; top: -17px; transform: translateX(-50%); font-size: 11px; line-height: 14px; font-weight: 600; color: #b7791f; background: var(--sheet); padding: 0 6px; white-space: nowrap; pointer-events: none; }
  .mxwin { position: absolute; top: 0; bottom: 0; z-index: -1; border: 1px solid var(--amber); box-shadow: inset 0 0 0 1px var(--amber); border-radius: 6px; background: #fffaf0; pointer-events: none; }
  .mxd { border: 1px solid transparent; border-radius: 5px; padding: 3px 2px 4px 2px; cursor: pointer; min-width: 0; }
  .mxd:hover { border-color: var(--rule); background: #fdfaf5; }
  .mxd .cubes { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
  .mxd .cubes .cube { min-width: 0; width: 100%; height: 15px; padding: 0; font-size: 10px; border-radius: 3px; }
  .mxd .cubes .empty { height: 15px; }
  .mxh { display: block; text-align: center; font-size: 11.5px; font-weight: 500; color: var(--ink); line-height: 1.25; }
  .mxh small { display: block; font-weight: 400; color: var(--ink-3); font-size: 9.5px; letter-spacing: .02em; }
  .mxh .mon { color: var(--amber); }
  .mxh:hover { color: var(--amber); }
  .mxh.on { color: var(--amber); }
  .mxr { font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 8px; cursor: pointer; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: flex-end; }
  .mxr:hover, .mxr.on { color: var(--ink); }
  .mxc { display: flex; gap: 3px; align-items: center; min-height: 20px; padding: 1px 0; border-bottom: 1px solid #f3ede4; }
  .mxc.dim { opacity: .3; }
  .cube { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 18px; padding: 0 5px; border-radius: 3px; border: 1px solid; font-size: 10.5px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .cube:hover { box-shadow: 0 0 0 1px currentColor inset; }
  .cube.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .cube.failed { background: var(--wash-red); border-color: var(--red); color: var(--red); }
  .cube.retrying { background: var(--wash-amber); border-color: var(--amber); color: #9a5f05; }
  .cube.slow { background: var(--wash-amber); border-color: var(--amber); border-style: dashed; color: #9a5f05; }
  .cube.queued { background: var(--wash-sand); border-color: #c9bfb2; color: var(--ink-2); }
  .cube.snoozed { background: var(--wash-sand); border-color: #c9bfb2; border-style: dashed; color: var(--ink-2); }
  .cube.succeeded { background: var(--wash-green); border-color: var(--green); color: var(--green); }
  .dline { position: relative; height: 22px; margin: 5px 0 0 0; user-select: none; }
  .dline::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: #cfc3b3; }
  .dsel { position: absolute; top: 0; height: 12px; z-index: 1; cursor: grab; }
  .dsel::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 4px; background: var(--amber); border-radius: 2px; }
  .dsel:hover::before { top: 3px; height: 6px; }
  .dsel.grabbing { cursor: grabbing; }
  .dsel.grabbing::before { top: 3px; height: 6px; }
  .dh { position: absolute; top: 0; width: 10px; height: 12px; margin-left: -5px; border-radius: 3px; background: var(--sheet); border: 1.5px solid var(--amber); cursor: ew-resize; z-index: 2; }
  .dlab { position: absolute; top: 12px; font-size: 11px; color: var(--ink); white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  /* time window (legacy) */
  .tw { display: grid; grid-template-columns: 110px 1fr 110px; gap: 14px; align-items: end; padding: 8px 24px 2px 24px; }
  .twl { padding-bottom: 6px; }
  .twl { font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tw-to { text-align: right; }
  .twtrack { position: relative; height: 154px; user-select: none; }
  .twtrack svg { position: absolute; left: 0; right: 0; bottom: 8px; width: 100%; height: 138px; }
  .twtrack svg g.col { opacity: .3; }
  .twtrack svg g.col.in { opacity: 1; }
  .twtrack svg rect.cube { rx: 3; }
  .twtrack svg rect.failed { fill: var(--wash-red); stroke: var(--red); }
  .twtrack svg rect.retrying { fill: var(--wash-amber); stroke: var(--amber); }
  .twtrack svg rect.slow { fill: var(--wash-amber); stroke: var(--amber); stroke-dasharray: 2 2; }
  .twtrack svg rect.queued { fill: var(--wash-sand); stroke: #c9bfb2; }
  .twtrack svg rect.snoozed { fill: var(--wash-sand); stroke: #c9bfb2; stroke-dasharray: 2 2; }
  .twtrack svg rect.succeeded { fill: var(--wash-green); stroke: var(--green); }
  .twtrack svg text { font-family: var(--sans); font-size: 10px; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .twtrack svg text.failed { fill: var(--red); } .twtrack svg text.retrying, .twtrack svg text.slow { fill: #9a5f05; } .twtrack svg text.succeeded { fill: var(--green); } .twtrack svg text.queued, .twtrack svg text.snoozed { fill: var(--ink-2); }
  .twtrack svg rect.hit { fill: transparent; }
  .twrows { position: absolute; left: -112px; top: 0; width: 100px; height: 138px; display: grid; grid-template-rows: repeat(6, 1fr); font-size: 11px; color: var(--ink-3); text-align: right; }
  .twrows span { display: flex; align-items: center; justify-content: flex-end; }
  .twdays { grid-column: 2; display: flex; gap: 6px; padding: 0 0 6px 0; }
  .twdays span { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: pointer; }
  .twdays span:hover { border-color: #d9cdbd; }
  .twdays span.on { background: var(--wash-amber); border-color: #e8c98a; color: var(--ink); }
  .twtrack svg rect.cube { cursor: pointer; }
  .twtrack svg rect.cube:hover { stroke-width: 2; }
  .twtrack svg rect.cube.sel { stroke: var(--ink); stroke-width: 2; stroke-dasharray: none; }
  .twtrack::after { content: ""; position: absolute; left: 0; right: 0; bottom: 8px; height: 2px; background: #cfc3b3; }
  .twsel { position: absolute; bottom: 7px; height: 4px; background: var(--amber); border-radius: 2px; }
  .twh { position: absolute; bottom: -1px; width: 14px; height: 18px; margin-left: -7px; border-radius: 4px; background: var(--sheet); border: 1.5px solid var(--amber); cursor: ew-resize; box-shadow: 0 1px 3px rgba(60,40,20,.15); }
  .twh::after { content: ""; position: absolute; left: 5px; top: 5px; width: 2px; height: 6px; background: var(--amber); box-shadow: 3px 0 0 var(--amber); }
  .stat.green::before { background: var(--green); }
  .stats { grid-template-columns: repeat(7, 1fr); }
  .stat.blue::before { background: var(--blue); }
  .cube.running { background: #e3ecf7; border-color: var(--blue); color: var(--blue); }
  /* status panels */
  .stats { display: grid; gap: 10px; padding: 6px 24px 4px 24px; }
  .stat { position: relative; padding: 8px 14px 8px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; }
  .stat:hover { border-color: #d9cdbd; background: #fffcf6; }
  .stat b { font-size: 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); }
  .stat .sub { grid-column: 1 / span 2; margin-left: 0; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
  .stat::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: #c9bfb2; }
  .stat.red::before { background: var(--red); } .stat.amber::before { background: var(--amber); }
  .stat.on { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); background: #fffaf0; }
  .stat.dim { opacity: .45; }
  /* cards */
  .cards { padding: 6px 24px 24px 24px; }
  .ghead { display: flex; align-items: center; gap: 10px; padding: 16px 2px 8px 2px; font-weight: 500; cursor: pointer; }
  .ghead .chev { color: var(--ink-3); font-size: 11px; width: 10px; }
  .ghead .cnt { display: inline-block; padding: 1px 9px; border-radius: 999px; font-weight: 500; font-size: 12px; background: var(--wash-sand); color: var(--ink-2); }
  .ghead .cnt.red { background: var(--wash-red); color: var(--red); }
  .ghead .cnt.amber { background: var(--wash-amber); color: #9a5f05; }
  .card { display: grid; grid-template-columns: 14px minmax(380px, 1fr) minmax(380px, 1.1fr) 150px; gap: 2px 18px; align-items: start; padding: 9px 16px 9px 14px; margin-bottom: 8px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
  .card .mid { grid-column: 3; grid-row: 1 / span 2; min-width: 0; }
  .card .chain { display: flex; align-items: center; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
  .card .chain i { width: 14px; height: 14px; border-radius: 3px; background: #bfe0cf; border: 1px solid #9fd1b8; }
  .card .chain i.f { background: var(--wash-red); border-color: var(--red); }
  .card .chain i.s { background: transparent; border: 1px dashed #d6ccbf; }
  .card .chain i.r { background: #e3ecf7; border-color: var(--blue); }
  .card .chain i.q { background: transparent; border: 1px solid #d6ccbf; }
  .card .chain em { font-style: normal; color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }
  .card .msg { margin-top: 7px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .msg.red { color: var(--red); }
  .card .msg .dim { color: var(--ink-3); }
  .card .cmpm { margin-top: 5px; display: grid; grid-template-columns: 34px 1fr; gap: 3px 6px; align-items: center; font-size: 10.5px; color: var(--ink-3); }
  .card .cmpm i { display: block; height: 5px; border-radius: 2px; background: #d9cfc2; }
  .card .cmpm i.now { background: var(--red); } .card .cmpm i.now.amb { background: var(--amber); } .card .cmpm i.now.grn { background: #7fc9a9; }
  .card:hover { border-color: #d9cdbd; background: #fffcf6; }
  .card.on { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); background: #fffaf0; }
  .card .sd { grid-column: 1; grid-row: 1; width: 8px; height: 8px; border-radius: 50%; background: #c9bfb2; margin-top: 7px; }
  .card .sd.red { background: var(--red); } .card .sd.amber { background: var(--amber); }
  .card .l1 { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .card .nm { font-family: var(--mono); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card .nm i { font-style: normal; color: var(--ink-3); }
  .ty { flex: none; display: inline-flex; width: 16px; height: 16px; color: var(--ink-3); }

  }
  function mockTail(t, task, cause, hh) {

    var keep = lines.slice(0, Math.max(40, lines.length - 12));
    var base = keep.length ? keep[keep.length - 1].slice(0, 5) : '12:00';
    var m = parseInt(base.slice(3), 10) || 0, h = base.slice(0, 2);
    var T = function (dm) { var mm = (m + dm) % 60; return h + ':' + pad(mm) + ':' + pad(12 + dm * 7 % 47); };
    var tail = [];
    if (cause === 'Table not found') tail = [
      T(0) + ' [pipeline] ' + task + ' ctor', T(0) + ' ctor took 0.000s', T(0) + ' [' + task + '] [pipeline] pre_execute', T(0) + ' [' + task + '] pre_execute took 0.011s',
      T(1) + ' [' + task + '] [pipeline] execute', T(1) + ' [load] target=finance.gl_staging mode=merge keys=[MANDT,BUKRS,BELNR,GJAHR]',
      T(1) + ' [load] resolving target table',
      T(1) + ' ERROR [' + task + '] execute failed after 2.104s',
      'Traceback (most recent call last):', '  File "/Workspace/Repos/finance-gl/src/gl/' + task + '.py", line 41, in execute', '    spark.table("finance.gl_staging")',
      'pyspark.errors.exceptions.captured.AnalysisException: [TABLE_OR_VIEW_NOT_FOUND] The table or view `finance`.`gl_staging` cannot be found. Verify the spelling and correctness of the schema and catalog. SQLSTATE: 42P01',

      T(0) + ' [' + task + '] [pipeline] execute', T(0) + ' [read] partitions=24 parallelism=6',
      T(3) + ' WARN  [spark] Executor 4 lost: Spot instance reclaimed by cloud provider',
      T(3) + ' WARN  [spark] Executor 2 lost: Spot instance reclaimed by cloud provider',
      T(4) + ' ERROR [cluster] Driver terminated: CLOUD_PROVIDER_SHUTDOWN (spot capacity reclaimed, 2 of 6 workers)',

  function buildRoute(it, selTask, selIdx) {

    var ok = it.ntasks - it.failed.length, skipped = it.failed.length ? Math.floor(it.ntasks * 0.19) : 0; ok -= skipped;
    var pct = function (s) { var m = Math.max(it.total, it.last, it.usual); return Math.round(100 * s / m) + '%'; };
    var runBody = '<div class="cmp"><span>this run</span><div class="barx"><i class="now' + (it.kind === 'slow' ? ' amber' : '') + '" style="width:' + pct(it.total) + '"></i></div><span class="num">' + (it.total ? dur(it.total) : '0s') + '</span>' +
      '<span>last run</span><div class="barx"><i style="width:' + pct(it.last) + '"></i></div><span class="num">' + dur(it.last) + '</span>' +
      '<span>usual</span><div class="barx"><i style="width:' + pct(it.usual) + '"></i></div><span class="num">' + dur(it.usual) + '</span></div>';

    var flist = '';

      Object.keys(byCause).forEach(function (lab) {

        byCause[lab].forEach(function (x) { flist += '<div class="frow' + (x.i === selTask ? ' on' : '') + '" data-f="' + x.i + '"><span>' + x.f.name + '</span><span class="r">' + it.start + ', ' + x.f.secs + 's</span></div>'; });

    var causesN = {}; it.failed.forEach(function (f) { causesN[f.cause.label] = 1; });
    var tasksHead = it.failed.length ? it.failed.length + ' failed, ' + ok + ' ok, ' + skipped + ' skipped' : it.kind === 'retrying' ? '1 retrying, ' + (it.ntasks - 1) + ' ok' : it.ntasks + ' tasks';
    var tasksR = it.failed.length > 1 ? Object.keys(causesN).length + (Object.keys(causesN).length > 1 ? ' causes' : ' cause') : '';

    var html = panel('', 'Job', it.ntasks + ' tasks', 'daily 06:00, runs as ' + it.runAs, '', false) +
      panel('', 'Run', it.total ? dur(it.total) : 'not started', 'usual ' + dur(it.usual), runBody, true) +
      panel('', 'Tasks', tasksHead, tasksR,
        '<div class="vsw"><span class="' + (taskView === 'timeline' ? 'on' : '') + '" data-view="timeline">Timeline</span><span class="' + (taskView === 'grid' ? 'on' : '') + '" data-view="grid">Grid</span>' + '' + '</div>' +
        (taskView === 'timeline' ? ganttHtml(it, selTask) : strip) + flist, true);

    if (it.failed.length) {
      var f = it.failed[selTask];
      html += panel('fail', 'Root', f.cause.label, '', '<div class="err">' + f.cause.detail + '<br><span class="dim">' + f.name + ', line 41.' + (f.cause.label === 'Table not found' ? ' Same error in 87 other jobs since 07:10.' : '') + '</span></div>', true);
      var trow = (selIdx !== undefined && selIdx !== null) ? schedule(it)[selIdx] : null;
      var tname = trow ? trow.name : f.name, tst = trow ? trow.st : 'f', tcause = trow && trow.st === 'f' ? it.failed[trow.fail].cause.label : (trow && trow.st !== 'f' ? 'ok' : f.cause.label);
      html += panel('last', 'Task', '<span class="mono" style="font-family:var(--mono);font-weight:400">' + tname + '</span>', 'Python script',
        '<div class="kv"><span>source</span><a href="#" class="path">/Workspace/Repos/finance-gl/src/gl/' + tname + '.py</a>' +
        '<span>parameters</span><span class="mono">date=2026-09-18  catalog=finance  mode=incremental</span>' +
        '<span>compute</span><span>ingest_cluster, 15.4 LTS, i4i.2xlarge, 2 to 10 workers, spot</span>' +
        '<span>cluster</span><span class="mono">0918-0600-gl4x</span></div>' +
        '<div class="logh"><b>Log</b><span id="logmeta">loading</span><span class="r">open full log ↗</span></div><div class="log" id="tasklog" data-task="' + tname + '" data-st="' + tst + '" data-cause="' + tcause + '"></div>', true);

      html += panel('last', 'Task', '<span style="font-family:var(--mono);font-weight:400">transform</span>', 'Notebook', '<div class="kv"><span>source</span><a href="#" class="path">/Workspace/Repos/finance-gl/src/gl/transform</a><span>parameters</span><span class="mono">date=2026-09-18  catalog=finance</span><span>compute</span><span>serverless</span></div>', true);
    } else if (it.kind === 'running') {
      html += panel('last', 'Root', 'Running, on track', '', '<div class="kv"><span>progress</span><span>' + runIdx(it) + ' of ' + it.ntasks + ' tasks done</span><span>elapsed</span><span>' + dur(it.total) + ', average ' + dur(it.usual) + '</span></div>', true);
    } else if (it.kind === 'queued') {
      html += panel('fail', 'Root', 'Queued', '', '<div class="err">MAX_CONCURRENT_RUNS_REACHED<br><span class="dim">Job allows 1 concurrent run. The previous run is still going.</span></div>', true);

      html += panel('fail', 'Root', 'Cluster error, retrying', '', '<div class="err">spot instances reclaimed<br><span class="dim">extract_bseg, attempt 1 failed after 48m 22s. Attempt 2 running on on-demand workers.</span></div>', true);
      html += panel('last', 'Task', '<span style="font-family:var(--mono);font-weight:400">extract_bseg</span>', 'Python script', '<div class="kv"><span>source</span><a href="#" class="path">/Workspace/Repos/finance-gl/src/gl/extract_bseg.py</a><span>parameters</span><span class="mono">date=2026-09-18  catalog=finance  mode=incremental</span><span>compute</span><span>ingest_cluster, 15.4 LTS, i4i.2xlarge, 2 to 10 workers, spot</span></div>', true);
    } else {
      html += panel('last', 'Root', 'Snoozed until 15:00', '', '', false);
    }
    route.innerHTML = html;

    route.querySelectorAll('.hd').forEach(function (h) { h.addEventListener('click', function () { var p = h.parentNode; if (!p.querySelector('.bd')) return; p.classList.toggle('open'); h.querySelector('.chev').textContent = p.classList.contains('open') ? '▾' : '▸'; }); });
    route.querySelectorAll('.frow, .tasks i.f').forEach(function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); buildRoute(it, +el.dataset.f, null); }); });
    route.querySelectorAll('.vsw [data-view]').forEach(function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); taskView = el.dataset.view; buildRoute(it, selTask); }); });
    route.querySelectorAll('.vsw [data-all], .grow.fold').forEach(function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); showAll = !showAll; buildRoute(it, selTask); }); });
    (function drawLinks() {
      var g = route.querySelector('.gantt'); if (!g) return;
      var gr = g.getBoundingClientRect();
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'links'); svg.setAttribute('width', g.scrollWidth); svg.setAttribute('height', g.scrollHeight);
      svg.innerHTML = '<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#b9ab99"/></marker><marker id="arrf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d6452f"/></marker></defs>';
      var rowsEl = {}; g.querySelectorAll('.grow[data-i]').forEach(function (el) { rowsEl[el.dataset.i] = el; });
      g.querySelectorAll('.grow[data-i]').forEach(function (el) {
        var dep = el.dataset.dep; if (dep === '-1' || !rowsEl[dep]) return;
        var a = rowsEl[dep].querySelector('.sq'), b = el.querySelector('.sq'); if (!a || !b) return;
        var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        var x1 = ra.left - gr.left + 1, y1 = ra.bottom - gr.top;
        var y2 = rb.top - gr.top + rb.height / 2;
        var x2 = (rb.left - gr.left) >= x1 ? rb.left - gr.left - 1 : rb.right - gr.left + 1;
        var dpath = 'M' + x1 + ',' + y1 + ' V' + y2 + ' H' + x2;
        var isF = b.classList.contains('f');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', dpath); path.setAttribute('marker-end', isF ? 'url(#arrf)' : 'url(#arr)'); if (isF) path.setAttribute('class', 'f');
        svg.appendChild(path);
      });
      g.appendChild(svg);
    })();
    route.querySelectorAll('.grow[data-i]').forEach(function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); buildRoute(it, el.dataset.f !== '' ? +el.dataset.f : selTask, +el.dataset.i); }); });
    (function () {
      var el = route.querySelector('#tasklog'); if (!el) return;
      var name = el.dataset.task, st = el.dataset.st, cause = el.dataset.cause;
      var pickLog = ['log-a.txt', 'log-b.txt', 'log-c.txt'][(name.length + it.id) % 3];
      loadLog(pickLog).then(function (t) {
        var text = st === 'f' ? mockTail(t, name, cause) : (it.kind === 'retrying' && st === 'r') ? mockTail(t, name, 'retrying') : t;
        renderLog(el, text, st);
        var meta = route.querySelector('#logmeta'); if (meta) meta.textContent = text.split('\n').length + ' lines' + (st === 'f' ? ', ends at the error' : '');
      }).catch(function () { el.textContent = 'log not available'; });
    })();
  }
  var navUrl = ((performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}).name || '';
  if (/open=(\d+)/.test(navUrl + ' ' + location.hash + location.search)) { var want = +RegExp.$1; var cand = items.filter(function (x) { return x.kind === 'failed' && x.failed.length >= want; })[0]; if (cand) { var st = document.createElement('style'); st.textContent = '* { transition: none !important; }'; document.head.appendChild(st); open(cand.id); } }
})();
